cv:
  name: Taesoo Kim
  label: PhD Student, Electrical and Computer Engineering
  email: taesoo.kim@gatech.edu
  location: Atlanta, GA
  image: ""
  summary: >
    PhD student at Georgia Tech working on advanced semiconductor packaging and heterogeneous integration.
    Designing chiplet-based, high-bandwidth systems for AI and high-performance computing, centered on
    HBM-GPU interconnects in glass-core and interposer architectures. My work integrates signal/power-integrity
    (SI/PI) co-design and energy-per-bit optimization, using full-wave EM and circuit simulation
    (Ansys HFSS/SIwave, Keysight ADS) together with machine-learning-driven design methods, to enable
    scalable, energy-efficient heterogeneous integration.

